[package]
name = "pith-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The pith kernel engine: arena graph, sync step machine, async scheduler"

[lints]
workspace = true

[features]
# Exposes `state::conformance`, the cross-adapter suite an engine-state adapter
# proves itself against (decision 0025). Off by default: it is test scaffolding,
# not part of the engine.
testing = ["dep:proptest"]

[dependencies]
pith-diag.workspace = true
pith-ids.workspace = true
pith-arena.workspace = true
pith-core.workspace = true
pith-output.workspace = true
pith-store.workspace = true
indexmap.workspace = true
smallvec.workspace = true
tracing.workspace = true

# Decisions 0021, 0022: runtime adapter boundary.
tokio.workspace = true
async-trait.workspace = true

# Optional so the conformance suite can live in the library rather than in a
# test file no other crate can reach.
proptest = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
async-trait.workspace = true
# `time` is test-only: the concurrency tests bound their barrier waits so a
# serialized engine fails instead of hanging.
tokio = { workspace = true, features = ["time"] }

[[bench]]
name = "scale"
harness = false
