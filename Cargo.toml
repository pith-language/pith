[workspace]
resolver = "2"
members = [
    "crates/pith-diag",
    "crates/pith-output",
    "crates/pith-ids",
    "crates/pith-store",
    "crates/pith-arena",
    "crates/pith-core",
    "crates/pith-engine",
    "crates/pith-executor-local",
    "crates/pith-state-sqlite",
    "crates/xylem",
    "crates/phloem",
    "crates/pith-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/pith-language/pith"
publish = false

[workspace.dependencies]
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
la-arena = "0.3"
text-size = "1.1"
line-index = "0.1"
indexmap = "2"
smallvec = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
diesel = { version = "2.3", default-features = false, features = [
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
] }
# Bundled so the engine-state schema does not depend on a system sqlite whose
# version varies per machine. MIT, like diesel's other sqlite dependencies.
libsqlite3-sys = { version = "0.35", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
# async fn in dyn-dispatch traits (ActionRule is stored as Box<dyn ActionRule>).
# Native async-fn-in-trait does not support dyn dispatch; async_trait is the
# standard solution.
async-trait = "0.1"
# Typed Linux syscalls for the sandboxed executor (decision 0028). Chosen over
# raw `libc` to minimize `unsafe`: rustix wraps the landlock and process
# surface the executor needs, leaving `unsafe` only for the seccomp and any
# landlock calls rustix does not yet expose.
rustix = { version = "1", default-features = false, features = ["process"] }
# Syscall numbers for the seccomp allowlist (decision 0028). rustix wraps calls,
# not the per-architecture number table the BPF program compares against, and a
# transcribed table is wrong in exactly the way that grants one syscall while
# denying another.
libc = "0.2.189"
# Per-action scratch roots for the sandboxed executor (decision 0028).
tempfile = "3"
anstream = "0.6"
anstyle = "1"
owo-colors = "4"
clap = { version = "4", features = ["derive"] }
proptest = "1"
proptest-derive = "0.5"
arbitrary = { version = "1", features = ["derive"] }
insta = { version = "1", features = ["json"] }
pith-diag = { path = "crates/pith-diag", version = "0.1.0" }
pith-output = { path = "crates/pith-output", version = "0.1.0" }
pith-ids = { path = "crates/pith-ids", version = "0.1.0" }
pith-store = { path = "crates/pith-store", version = "0.1.0" }
pith-arena = { path = "crates/pith-arena", version = "0.1.0" }
pith-core = { path = "crates/pith-core", version = "0.1.0" }
pith-engine = { path = "crates/pith-engine", version = "0.1.0" }
pith-state-sqlite = { path = "crates/pith-state-sqlite", version = "0.1.0" }
pith-executor-local = { path = "crates/pith-executor-local", version = "0.1.0" }
xylem = { path = "crates/xylem", version = "0.1.0" }
phloem = { path = "crates/phloem", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"
missing_abi = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"
invalid_codeblock_attributes = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
host_endian_bytes = "deny"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
