<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 348" width="900" height="348" role="img" aria-labelledby="ledger-t ledger-d">
<title id="ledger-t">Action computations planned</title>
<desc id="ledger-d">A cold build plans five action computations. Editing one of the two sources plans three. When nothing changed, none: the root is reused. In a new process over the same store, none: the recorded attempt is hydrated.</desc>
<style>
  :root { --bg: #F0EAD8; --ink: #23201A; --muted: #4E4936; --line: #938E82; --good: #2E5A3C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1C17; --ink: #F0EAD8; --muted: #8A927B; --line: #494B41; --good: #5E8A6E; } }
  text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  .head { font-size: 12px; letter-spacing: 1.4px; fill: var(--muted); }
  .label { font-size: 18px; fill: var(--ink); }
  .num { font-size: 64px; font-weight: 600; fill: var(--ink); }
  .num.good { fill: var(--good); }
  .note { font-size: 12px; letter-spacing: 1.2px; fill: var(--muted); }
  .note.good { fill: var(--good); }
  .rule { stroke: var(--line); stroke-width: 1; }
  .lead { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1 6; }
</style>

<rect width="900" height="348" fill="var(--bg)"/>

<text class="mono head" x="30" y="26">ACTION COMPUTATIONS PLANNED</text>
<line class="rule" x1="30" y1="44" x2="870" y2="44"/>

<text class="label" x="30" y="94">cold build</text>
<line class="lead" x1="250" y1="87" x2="690" y2="87"/>
<text class="mono num" x="750" y="109" text-anchor="end">5</text>
<line class="rule" x1="30" y1="130" x2="870" y2="130"/>

<text class="label" x="30" y="170">one source edited</text>
<line class="lead" x1="250" y1="163" x2="690" y2="163"/>
<text class="mono num" x="750" y="185" text-anchor="end">3</text>
<line class="rule" x1="30" y1="196" x2="870" y2="196"/>

<text class="label" x="30" y="236">nothing changed</text>
<line class="lead" x1="250" y1="229" x2="690" y2="229"/>
<text class="mono num good" x="750" y="251" text-anchor="end">0</text>
<text class="mono note good" x="870" y="251" text-anchor="end">REUSED</text>
<line class="rule" x1="30" y1="262" x2="870" y2="262"/>

<text class="label" x="30" y="302">new process, same store</text>
<line class="lead" x1="250" y1="295" x2="690" y2="295"/>
<text class="mono num good" x="750" y="317" text-anchor="end">0</text>
<text class="mono note good" x="870" y="317" text-anchor="end">HYDRATED</text>
<line class="rule" x1="30" y1="328" x2="870" y2="328"/>
</svg>
