[default]
locale = "en-us"

[default.extend-words]
# crate names and terms that are intentionally spelled this way
hd = "hd"
intra = "intra"
flate = "flate"
# british spellings used throughout the project's prose
behaviour = "behaviour"
flavour = "flavour"
labour = "labour"

[files]
extend-exclude = [
    "docs/",
    "flake.lock",
    "Cargo.lock",
    "*.snap",
    "*.snap.new",
]
