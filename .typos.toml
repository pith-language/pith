[default]
locale = "en-us"

[default.extend-words]
# crate names and terms that are intentionally spelled this way
hd = "hd"
intra = "intra"
flate = "flate"
# opentype variation axis tags used by the web fonts
wdth = "wdth"
opsz = "opsz"
# british spellings used throughout the project's prose
behaviour = "behaviour"
flavour = "flavour"
labour = "labour"

[files]
extend-exclude = [
    "docs/",
    "flake.lock",
    "Cargo.lock",
    "*.snap",
    "*.snap.new",
    # machine-generated: @font-face blocks carry unicode-range codepoints
    "web/src/styles/fonts.css",
]
