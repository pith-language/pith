name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # The shared runners count filesystem writes against the RAM quota, and
  # their storage drains writeback too slowly for two heavy processes at
  # once: a rustc and an lld were SIGKILled (137) as a pair at two build
  # jobs, with the linker already streaming (--no-keep-memory) and test
  # artifacts already line-tables-only. One build job serializes the heavy
  # processes and gives the writeback room to drain between them; the jobs
  # setting is not part of cargo's fingerprints, so this keeps the failed
  # run's cache warm. Local `just test-ci` is unaffected by all three.
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: 1
  RUSTFLAGS: "-D warnings -C link-arg=-Wl,--no-keep-memory"

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container:
      image: codeberg.org/getnix/ci-nix:v1.0.0
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting and spelling
            task: treefmt-check
            dev_shell: ci-format
            runner: codeberg-small
          - name: Clippy
            task: clippy
            dev_shell: ci-rust
            runner: codeberg-medium
            cache_key: clippy
          - name: Tests
            task: test-ci
            dev_shell: ci-rust
            runner: codeberg-medium
            cache_key: tests
          - name: Documentation
            task: docs-check
            dev_shell: ci-rust
            runner: codeberg-medium
            cache_key: docs
          - name: Dependency policy
            task: deny
            dev_shell: ci-deny
            runner: codeberg-small
          - name: Repository invariants
            task: repo-check
            dev_shell: ci-rust
            runner: codeberg-medium
            cache_key: repository
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v5
        with:
          persist-credentials: false
      - name: Restore Cargo dependencies
        if: matrix.cache_key
        continue-on-error: true
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.cache_key }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.cache_key }}-
      - name: Run check via nix + just
        env:
          DEV_SHELL: ${{ matrix.dev_shell }}
          TASK: ${{ matrix.task }}
        run: nix develop --print-build-logs ".#$DEV_SHELL" --command just "$TASK"
